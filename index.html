<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>抽唄抽背練習平臺</title>
  
  <link href="https://cdn.jsdelivr.net/npm/gensen-rounded-web@1.0.1/css/gensen-rounded-tw.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;500;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>

  <style>
    * {
      font-family: 'Chiron GoRound TC', 'GenSenRounded TW', sans-serif !important;
    }
    
    /* 自訂捲軸樣式 */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f1f1; 
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #e8d5d7; 
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #d49a9e; 
    }
    
    /* 彈出視窗動畫 */
    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.95) translateY(-10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .modal-animate {
      animation: modalFadeIn 0.3s ease-out forwards;
    }
  </style>
</head>
<body class="bg-[#f9f9fa]">
  <div id="root"></div>

  <script type="text/babel" data-presets="react" data-runtime="classic">
    const { useState, useEffect } = React;

    // --- 圖示元件 ---
    const IconSearch = ({ size = 24, className = "" }) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>;
    const IconHome = ({ size = 24, className = "" }) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>;
    const IconBookOpen = ({ size = 24, className = "" }) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>;
    const IconGlobe = ({ size = 24, className = "" }) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1 4-10z"></path></svg>;
    const IconRefreshCw = ({ size = 24, className = "" }) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>;
    const IconAlertCircle = ({ size = 24, className = "" }) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>;
    const IconChevronRight = ({ size = 24, className = "" }) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>;
    const IconFeather = ({ size = 24, className = "" }) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"></path><line x1="16" y1="8" x2="2" y2="22"></line><line x1="17.5" y1="15" x2="9" y2="15"></line></svg>;
    const IconUser = ({ size = 24, className = "" }) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>;
    const IconTrophy = ({ size = 24, className = "" }) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path></svg>;
    const IconX = ({ size = 24, className = "" }) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>;
    const IconCheckCircle = ({ size = 24, className = "" }) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>;
    const IconLogOut = ({ size = 24, className = "" }) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>;
    const IconGraduationCap = ({ size = 24, className = "" }) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"></path><path d="M6 12v5c3 3 9 3 12 0v-5"></path></svg>;
    
    // --- 資料定義 ---
    const data = {
      chinese: {
        g7: [
          { id: 'ch-g7-1', title: '兒時記趣', url: 'https://kingfishcc.github.io/Childhood-Story-Rearrange/' },
          { id: 'ch-g7-2', title: '傘', url: 'https://kingfishcc.github.io/The-Umbrella-Rearrange/' },
          { id: 'ch-g7-3', title: '夏夜', url: 'https://kingfishcc.github.io/Summer-Night-Rearrange/' }
        ],
        g8: [
          { id: 'ch-g8-1', title: '跳水', url: 'https://kingfishcc.github.io/Diving-Rearrange/' },
          { id: 'ch-g8-2', title: '風箏', url: 'https://kingfishcc.github.io/Kite-Rearrange/' },
          { id: 'ch-g8-3', title: '庭中有奇樹', url: 'https://kingfishcc.github.io/In-The-Courtyard-There-Is-A-Strange-Tree-Rearrange/' },
          { id: 'ch-g8-4', title: '慈烏夜啼', url: 'https://kingfishcc.github.io/Gentle-Crow-Nightly-Wails-Rearrange/' },
          { id: 'ch-g8-5', title: '愛蓮說', url: 'https://kingfishcc.github.io/On-the-Love-of-the-Lotus-Rearrange/' },
          { id: 'ch-g8-6', title: '一棵開花的樹', url: 'https://kingfishcc.github.io/A-Blooming-Tree-Rearrange/' },
          { id: 'ch-g8-7', title: '木蘭詩', url: 'https://kingfishcc.github.io/The-Ballad-of-Mulan-Rearrange/' },
          { id: 'ch-g8-8', title: '張釋之執法', url: 'https://kingfishcc.github.io/Zhang-Shizhi-Upholds-the-Law-Rearrange/' },
          { id: 'ch-g8-9', title: '我所知道的康橋', url: 'https://kingfishcc.github.io/The-Cambridge-I-Know-Rearrange/' },
          { id: 'ch-g8-10', title: '偶然', url: 'https://kingfishcc.github.io/By-Chance-Rearrange/' },
          { id: 'ch-g8-11', title: '陋室銘', url: 'https://kingfishcc.github.io/Inscription-on-the-Humble-Home-Rearrange/' },
          { id: 'ch-g8-12', title: '成功是失敗之母', url: 'https://gemini.google.com/share/47312c22ca61' }
        ],
        g9: [
          { id: 'ch-g9-1', title: '戲李白', url: 'https://kingfishcc.github.io/Teasing-Li-Bai-Rearrange/' },
          { id: 'ch-g9-2', title: '如夢令', url: 'https://kingfishcc.github.io/Lyrics-to-a-Dreamy-Chant-Rearrange/' },
          { id: 'ch-g9-3', title: '南鄉子', url: 'https://kingfishcc.github.io/Airing-My-Feelings-upon-Climbing-Beigu-Pavilion-of-Jingkou-Rearrange/' },
          { id: 'ch-g9-4', title: '與宋元思書', url: 'https://kingfishcc.github.io/Letter-to-Song-Yuansi-Rearrange/' },
          { id: 'ch-g9-5', title: '車過枋寮', url: 'https://kingfishcc.github.io/Fangliao-on-a-Bus-Rearrange/' }
        ]
      },
      english: {
        g7: {
          sem1: [],
          sem2: [
            { id: 'en-g7-2-1', title: 'Toast Art', url: 'https://gemini.google.com/share/f7279392c260' }
          ]
        },
        g8: {
          sem1: [],
          sem2: [
            { id: 'en-g8-2-1', title: '課本 P.10', url: 'https://gemini.google.com/share/290252f163da' },
            { id: 'en-g8-2-2', title: '課本 P.55-56', url: 'https://gemini.google.com/share/894b06f0f2ab' },
            { id: 'en-g8-2-3', title: '課本 P.77-78', url: 'https://gemini.google.com/share/cd3fd7d13db0' },
            { id: 'en-g8-2-4', title: 'as…as…\n譬喻句型', url: 'https://gemini.google.com/share/0e353becfc6a' }
          ]
        },
        g9: {
          sem1: [],
          sem2: [
            { id: 'en-g9-2-1', title: 'Unit 1', url: 'https://gemini.google.com/share/059f461e1510' },
            { id: 'en-g9-2-2', title: 'Unit 2', url: 'https://gemini.google.com/share/ec66c5413ae7' },
            { id: 'en-g9-2-3', title: 'Unit 3', url: 'https://gemini.google.com/share/194ee2e5fff8' }
          ]
        }
      }
    };

    // 計算總任務數
    const calculateTotalTasks = () => {
      let total = 0;
      Object.values(data.chinese).forEach(grade => total += grade.length);
      Object.values(data.english).forEach(grade => {
        total += grade.sem1.length + grade.sem2.length;
      });
      return total;
    };
    const TOTAL_TASKS = calculateTotalTasks();

    function App() {
      const [currentPage, setCurrentPage] = useState('home');
      const [semester, setSemester] = useState(2);
      
      // 登入系統狀態
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [user, setUser] = useState(null); // { name: string, type: 'guest' | 'google' }
      
      // 儲存物件：{ taskId: { correct: number, incorrect: number } }
      const [completedTasks, setCompletedTasks] = useState({}); 
      
      // 模擬排行榜資料 (包含正確率數據)
      const [leaderboard, setLeaderboard] = useState([
        { name: '王小明', tasksCount: 15, avgAccuracy: 0.95, score: 0, type: 'student' },
        { name: '李小華', tasksCount: 15, avgAccuracy: 0.88, score: 0, type: 'student' },
        { name: '陳大文', tasksCount: 12, avgAccuracy: 0.92, score: 0, type: 'google' },
        { name: '林美麗', tasksCount: 8, avgAccuracy: 0.75, score: 0, type: 'student' },
      ]);

      // 計算綜合分數的函數
      const calculateScore = (tasksCount, avgAccuracy) => {
        if (tasksCount === 0) return 0;
        const accuracyWeight = (avgAccuracy * 2 - 1) * 50; 
        return Math.round((tasksCount * 100) + accuracyWeight);
      };

      // 初始化排行榜分數與讀取本地資料
      useEffect(() => {
        setLeaderboard(prev => 
          prev.map(p => ({ ...p, score: calculateScore(p.tasksCount, p.avgAccuracy) }))
              .sort((a, b) => b.score - a.score)
        );

        document.title = '抽唄抽背練習平臺';
        
        const savedUser = localStorage.getItem('practiceHub_user');
        if (savedUser) {
          try {
            const parsedUser = JSON.parse(savedUser);
            setUser(parsedUser);
            
            const savedTasks = localStorage.getItem(`practiceHub_tasks_v2_${parsedUser.name}`);
            if (savedTasks) {
              setCompletedTasks(JSON.parse(savedTasks));
            }
          } catch (e) {
            console.error("Failed to parse saved user data");
          }
        }
      }, []);

      // 計算目前使用者的整體表現
      const getUserStats = () => {
        const taskIds = Object.keys(completedTasks);
        const tasksCount = taskIds.length;
        if (tasksCount === 0) return { tasksCount: 0, avgAccuracy: 0, score: 0 };

        let totalCorrect = 0;
        let totalQuestions = 0;
        
        taskIds.forEach(id => {
          totalCorrect += completedTasks[id].correct;
          totalQuestions += (completedTasks[id].correct + completedTasks[id].incorrect);
        });

        const avgAccuracy = totalQuestions === 0 ? 0 : totalCorrect / totalQuestions;
        const score = calculateScore(tasksCount, avgAccuracy);
        
        return { tasksCount, avgAccuracy, score };
      };

      // 當任務進度改變時，自動更新排行榜與本地儲存
      useEffect(() => {
        if (user) {
          localStorage.setItem(`practiceHub_tasks_v2_${user.name}`, JSON.stringify(completedTasks));
          
          const stats = getUserStats();
          
          setLeaderboard(prev => {
            const existingIdx = prev.findIndex(p => p.name === user.name);
            let newBoard = [...prev];
            
            if (existingIdx >= 0) {
              newBoard[existingIdx] = { ...newBoard[existingIdx], ...stats };
            } else if (stats.tasksCount > 0) {
              newBoard.push({ name: user.name, type: user.type, ...stats });
            }
            return newBoard.sort((a, b) => b.score - a.score);
          });
        }
      }, [completedTasks, user]);

      const getDaysUntilThursday = () => {
        const today = new Date();
        const dayOfWeek = today.getDay();
        return (4 - dayOfWeek + 7) % 7;
      };
      const daysUntilThursday = getDaysUntilThursday();

      const handleNavigate = (page) => {
        setCurrentPage(page);
        window.scrollTo(0, 0);
      };

      const toggleSemester = () => {
        setSemester(prev => (prev === 1 ? 2 : 1));
      };

      const handleTaskComplete = (taskId, url) => {
        if (user && !completedTasks[taskId]) {
          // 模擬答題數據：總題數 10~20 題，正確率約 70%~100%
          const totalQ = Math.floor(Math.random() * 11) + 10; 
          const minCorrect = Math.floor(totalQ * 0.7);
          const correct = Math.floor(Math.random() * (totalQ - minCorrect + 1)) + minCorrect;
          const incorrect = totalQ - correct;

          setCompletedTasks(prev => ({
            ...prev,
            [taskId]: { correct, incorrect }
          }));
        }
        window.open(url, '_blank');
      };

      const logout = () => {
        setUser(null);
        setCompletedTasks({}); // 登出時清空當前畫面進度
        localStorage.removeItem('practiceHub_user');
      };

      // 登入彈出視窗元件
      const LoginModal = () => {
        const [guestName, setGuestName] = useState('');

        if (!showLoginModal) return null;

        const handleGuestLogin = () => {
          if (!guestName.trim()) {
            alert('請輸入您的姓名');
            return;
          }
          const newUser = { name: guestName.trim(), type: 'student' };
          setUser(newUser);
          localStorage.setItem('practiceHub_user', JSON.stringify(newUser));
          
          // 讀取該使用者的歷史進度
          const savedTasks = localStorage.getItem(`practiceHub_tasks_v2_${newUser.name}`);
          if (savedTasks) {
            setCompletedTasks(JSON.parse(savedTasks));
          } else {
            setCompletedTasks({});
          }
          
          setShowLoginModal(false);
        };

        const handleGoogleLogin = () => {
          const newUser = { name: 'Google訪客', type: 'google' };
          setUser(newUser);
          localStorage.setItem('practiceHub_user', JSON.stringify(newUser));
          
          const savedTasks = localStorage.getItem(`practiceHub_tasks_v2_${newUser.name}`);
          if (savedTasks) {
            setCompletedTasks(JSON.parse(savedTasks));
          } else {
            setCompletedTasks({});
          }
          
          setShowLoginModal(false);
        };

        return (
          <div className="fixed inset-0 bg-gray-900/50 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
            <div className="bg-white rounded-[2rem] shadow-xl w-full max-w-md overflow-hidden modal-animate flex flex-col max-h-[90vh]">
              <div className="p-6 text-center border-b border-gray-50 pt-8">
                <h2 className="text-2xl font-bold text-gray-800 tracking-wider">請選擇登入方式</h2>
                <p className="text-sm font-bold text-gray-500 mt-2">以紀錄與同步您的練習成績</p>
              </div>
              
              <div className="p-6 overflow-y-auto space-y-4">
                {/* Google Login */}
                <button onClick={handleGoogleLogin} className="w-full bg-white border-2 border-[#82aeb1] hover:bg-[#f0f5f5] rounded-2xl p-4 flex flex-col transition-colors text-left group shadow-sm">
                  <div className="flex items-center mb-2">
                    <span className="font-bold text-2xl text-[#82aeb1] mr-3 font-mono">G</span>
                    <span className="font-bold text-lg text-[#82aeb1]">使用 Google 帳號登入</span>
                  </div>
                  <p className="text-xs text-gray-500 leading-relaxed pl-8">
                    <span className="font-bold text-[#82aeb1]">【自動同步】</span>成績自動儲存雲端並與您的帳號連結，能隨時在任何裝置查閱您的「歷程成績單」。
                  </p>
                </button>

                {/* Guest Login */}
                <div className="w-full bg-white border-2 border-gray-400 rounded-2xl p-4 flex flex-col text-left shadow-sm">
                  <div className="flex items-center mb-3">
                    <IconUser size={24} className="text-gray-600 mr-3" />
                    <span className="font-bold text-lg text-gray-700">使用自訂訪客姓名</span>
                  </div>
                  <p className="text-xs text-gray-500 leading-relaxed pl-9 mb-3">
                    <span className="font-bold text-gray-600">【本機儲存】</span>手動輸入您的姓名（例如：王小明），成績僅會儲存在這台電腦上。
                  </p>
                  <div className="pl-9 flex gap-2">
                    <input 
                      type="text" 
                      placeholder="請輸入姓名..." 
                      value={guestName}
                      onChange={(e) => setGuestName(e.target.value)}
                      onKeyDown={(e) => e.key === 'Enter' && handleGuestLogin()}
                      className="flex-1 border-2 border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-gray-400 font-bold text-gray-700 bg-gray-50 focus:bg-white"
                    />
                    <button 
                      onClick={handleGuestLogin}
                      className="bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded-xl text-sm transition-colors shadow-sm whitespace-nowrap"
                    >
                      登入
                    </button>
                  </div>
                </div>
              </div>

              <div className="p-4 bg-gray-50 text-center border-t border-gray-100">
                <button 
                  onClick={() => setShowLoginModal(false)}
                  className="text-red-400 hover:text-red-500 font-bold text-sm flex items-center justify-center w-full py-2 transition-colors"
                >
                  <IconX size={18} className="mr-1" /> 關閉視窗
                </button>
              </div>
            </div>
          </div>
        );
      };

      const handleSearch = (e) => {
        if (e.key === 'Enter') {
          const term = e.target.value.trim().toLowerCase();
          if (!term) return;

          let found = false;

          for (const [grade, lessons] of Object.entries(data.chinese)) {
            if (lessons.some(l => l.title.toLowerCase().includes(term))) {
              handleNavigate(`chinese-${grade}`);
              found = true;
              break;
            }
          }

          if (!found) {
            for (const [grade, semesters] of Object.entries(data.english)) {
              if (semesters.sem1.some(l => l.title.toLowerCase().includes(term))) {
                setSemester(1);
                handleNavigate(`english-${grade}`);
                found = true;
                break;
              }
              if (semesters.sem2.some(l => l.title.toLowerCase().includes(term))) {
                setSemester(2);
                handleNavigate(`english-${grade}`);
                found = true;
                break;
              }
            }
          }

          if (found) {
            e.target.value = '';
          } else {
            alert('找不到符合的課文名稱喔！請試試輸入其他關鍵字。');
          }
        }
      };

      const Navbar = () => (
        <nav className="bg-[#f2e8e9] text-gray-700 shadow-sm sticky top-0 z-50">
          <div className="w-full px-4 md:px-10">
            <div className="flex items-center justify-between h-16">
              {/* Logo */}
              <div className="flex items-center cursor-pointer flex-shrink-0" onClick={() => handleNavigate('home')}>
                <span className="font-bold text-xl md:text-2xl tracking-wider text-[#d49a9e]">PRACTICE<span className="text-gray-500">HUB</span></span>
              </div>
              
              {/* 搜尋與選單區塊 */}
              <div className="flex-1 flex items-center justify-end md:justify-between ml-4">
                
                {/* 搜尋列 (手機版隱藏) */}
                <div className="max-w-md w-full mx-4 hidden md:block">
                  <div className="relative">
                    <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
