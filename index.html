        g8: {

          ]
        }
      }
    };

    const calculateTotalTasks = () => {
      let total = 0;
      Object.values(data.chinese).forEach(grade => total += grade.length);
      Object.values(data.english).forEach(grade => {
        total += grade.sem1.length + grade.sem2.length;
      });
      return total;
    };
    const TOTAL_TASKS = calculateTotalTasks();
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwrDqOlfsws0EzeTlUFkO9Z9qCQp5r0EkIee8EbMX2udC1ii04FPNy8GrVW7DXySx8f/exec";

    // --- 主應用程式 ---
    function App() {
      const [currentPage, setCurrentPage] = useState('home');
      const [semester, setSemester] = useState(1);
      
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [user, setUser] = useState(null); 
      const [completedTasks, setCompletedTasks] = useState({}); 
      const [leaderboard, setLeaderboard] = useState([]);
      const [isAuthenticating, setIsAuthenticating] = useState(false);
      const [authError, setAuthError] = useState('');

      const calculateScore = (tasksCount) => tasksCount * 100;

      // 載入資料與監聽登入狀態
      useEffect(() => {
        document.title = '抽唄抽背練習平臺';
        
        // 取得排行榜
        if (GOOGLE_SCRIPT_URL) {
          fetch(GOOGLE_SCRIPT_URL)
            .then(res => res.json())
            .then(data => {
              if (Array.isArray(data)) {
                const filteredData = data.filter(d => d.type !== 'test');
                const sorted = filteredData.sort((a, b) => Number(b.score) - Number(a.score));
                setLeaderboard(sorted);
              }
            })
            .catch(err => console.log("Google Sheets load fallback:", err));
        }

        // 讀取本機紀錄
        const savedUser = localStorage.getItem('practiceHub_user');
        if (savedUser) {
          try {
            const parsedUser = JSON.parse(savedUser);
            setUser(parsedUser);
            const savedTasks = localStorage.getItem(`practiceHub_tasks_v6_${parsedUser.name}`);
            if (savedTasks) setCompletedTasks(JSON.parse(savedTasks));
          } catch (e) {}
        }

        // 監聽 Google (Firebase) 登入狀態
        const checkFirebase = setInterval(() => {
          if (window.isFirebaseReady && window.firebaseMethods) {
            clearInterval(checkFirebase);
            const unsubscribe = window.firebaseMethods.onAuthStateChanged(window.firebaseAuth, (firebaseUser) => {
              if (firebaseUser && firebaseUser.displayName) {
                const name = firebaseUser.displayName.substring(0, 12);
                const newUser = { type: 'google', name: name, photoURL: firebaseUser.photoURL };
                setUser(newUser);
                localStorage.setItem('practiceHub_user', JSON.stringify(newUser));
                
                const savedTasks = localStorage.getItem(`practiceHub_tasks_v6_${name}`);
                if (savedTasks) setCompletedTasks(JSON.parse(savedTasks));
              }
            });
            return () => unsubscribe();
          }
        }, 500);

        return () => clearInterval(checkFirebase);
      }, []);

      // 同步成績到 Google Sheets
      useEffect(() => {
        if (user) {
          localStorage.setItem(`practiceHub_tasks_v6_${user.name}`, JSON.stringify(completedTasks));
          
          if (user.type === 'test') return;
          
          const tasksCount = Object.keys(completedTasks).length;
          const score = calculateScore(tasksCount);
          
          setLeaderboard(prev => {
            const existingIdx = prev.findIndex(p => p.name === user.name);
            let newBoard = [...prev];
            
            if (existingIdx >= 0) {
              newBoard[existingIdx] = { ...newBoard[existingIdx], tasksCount, score };
            } else if (tasksCount > 0) {
              newBoard.push({ name: user.name, type: user.type, tasksCount, score });
            }
            
            const sortedBoard = newBoard.sort((a, b) => b.score - a.score);
            
            if (GOOGLE_SCRIPT_URL && tasksCount > 0) {
              fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ name: user.name, score, tasksCount, type: user.type })
              }).catch(err => console.log("Google Sheets sync error:", err));
            }
            
            return sortedBoard;
          });
        }
      }, [completedTasks, user]);

      // --- 登入邏輯 ---
      const loginGuest = (type, name) => {
        const newUser = { type, name };
        setUser(newUser);
        setShowLoginModal(false);
        localStorage.setItem('practiceHub_user', JSON.stringify(newUser));
        const savedTasks = localStorage.getItem(`practiceHub_tasks_v6_${name}`);
        if (savedTasks) {
          setCompletedTasks(JSON.parse(savedTasks));
        } else {
          setCompletedTasks({});
        }
      };

      const loginGoogle = async () => {
        if (!window.isFirebaseReady || !window.firebaseMethods) {
          setAuthError("系統初始化中，請稍候...");
          return;
        }

        setIsAuthenticating(true);
        setAuthError('');
        try {
          // 使用已經設定好參數的 provider
          const provider = window.firebaseProviders.GoogleAuthProvider;
          await window.firebaseMethods.signInWithPopup(window.firebaseAuth, provider);
          setShowLoginModal(false);
        } catch (err) {
          console.error("Google 登入失敗:", err);
          if (err.code === 'auth/unauthorized-domain') {
            setAuthError("【網域未授權】請確認網址已加入白名單。");
          } else if (err.code === 'auth/popup-closed-by-user') {
            setAuthError("您關閉了登入視窗。");
          } else if (err.code === 'auth/popup-blocked') {
            setAuthError("瀏覽器阻擋了彈出視窗，請允許顯示彈出視窗。");
          } else if (err.message.includes('Cross-Origin-Opener-Policy')) {
            setAuthError("【環境限制】目前的預覽環境阻擋了 Google 登入。請將網頁部署到 GitHub Pages 後即可正常登入！");
          } else {
            setAuthError(`登入發生錯誤 (${err.code})，請稍後再試。`);
          }
        } finally {
          setIsAuthenticating(false);
        }
      };

      const logout = async () => {
        if (user?.type === 'google' && window.isFirebaseReady) {
          try { await window.firebaseMethods.signOut(window.firebaseAuth); } catch(e) {}
        }
        setUser(null);
        setCompletedTasks({});
        localStorage.removeItem('practiceHub_user');
      };

      // --- 介面操作函數 ---
      const getDaysUntilThursday = () => {
        const today = new Date();
        const dayOfWeek = today.getDay();
        return (4 - dayOfWeek + 7) % 7;
      };
      const daysUntilThursday = getDaysUntilThursday();

      const handleNavigate = (page) => {
        setCurrentPage(page);
        window.scrollTo(0, 0);
      };

      const toggleSemester = () => setSemester(prev => (prev === 1 ? 2 : 1));

      const handleTaskClick = (item) => {
        if (user) {
          setCompletedTasks(prev => ({ ...prev, [item.id]: true }));
        }
        window.open(item.url, '_blank', 'noopener,noreferrer');
      };

      const handleSearch = (e) => {
        if (e.key === 'Enter') {
          const term = e.target.value.trim().toLowerCase();
          if (!term) return;
          let found = false;

          for (const [grade, lessons] of Object.entries(data.chinese)) {
            if (lessons.some(l => l.title.toLowerCase().includes(term))) {
              handleNavigate(`chinese-${grade}`);
              found = true;
              break;
            }
          }

          if (!found) {
            for (const [grade, semesters] of Object.entries(data.english)) {
              if (semesters.sem1.some(l => l.title.toLowerCase().includes(term))) {
                setSemester(1);
                handleNavigate(`english-${grade}`);
                found = true;
                break;
              }
              if (semesters.sem2.some(l => l.title.toLowerCase().includes(term))) {
                setSemester(2);
                handleNavigate(`english-${grade}`);
                found = true;
                break;
              }
            }
          }

          if (found) {
            e.target.value = '';
          } else {
            alert('找不到符合的課文名稱喔！請試試輸入其他關鍵字。');
          }
        }
      };

      // --- 登入彈跳視窗組件 ---
      const LoginModal = () => {
        const [guestName, setGuestName] = useState('');

        if (!showLoginModal) return null;

        const handleGuestLogin = (e) => {
          e.preventDefault();
          const name = guestName.trim();
          if (!name) return;
          if (name === '154502') { loginGuest('test', '測試模式'); return; }
          if (name === '測試模式' || name === '測試') { alert('此名稱已被保留，請使用其他姓名。'); return; }
          loginGuest('guest', name);
        };

        return (
          <div className="fixed inset-0 bg-gray-900/40 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
            <div className="bg-white rounded-3xl w-full max-w-md overflow-hidden shadow-2xl modal-animate border border-gray-100 flex flex-col">
              <div className="px-8 pt-8 pb-4 text-center border-b border-gray-50 flex-shrink-0">
                <h2 className="text-2xl font-bold text-gray-800 tracking-wider mb-2">學生登入</h2>
                <p className="text-sm text-gray-500 font-medium">請選擇您的登入方式</p>
              </div>

              <div className="p-8 space-y-6">
                {/* 1. Google 登入按鈕 (Firebase) */}
                <button 
                  onClick={loginGoogle}
                  disabled={isAuthenticating}
                  className="w-full group relative flex flex-col p-4 rounded-2xl border-2 border-blue-200 bg-white hover:bg-blue-50/40 transition-all text-left overflow-hidden cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
                >
                  <div className="flex items-center mb-2 relative z-10">

            <div className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
              <div className="flex flex-col md:flex-row justify-between items-center mb-10 relative">
                <div className="w-full flex justify-end md:absolute md:right-0 top-0">
                  {isEnglish && (
                    <button 
                      onClick={toggleSemester}
                      className="flex items-center px-4 py-2 border-2 border-[#d49a9e] text-[#d49a9e] rounded-full hover:bg-pink-50 transition-colors font-bold bg-white shadow-sm hover:shadow-md cursor-pointer"
                    >
                      切換至 {semester === 1 ? '下' : '上'}學期 <IconRefreshCw size={16} className="ml-2" />
                    </button>
                  )}
                </div>
                
                <div className="w-full flex justify-center items-center mt-8 md:mt-0">
                  <IconFeather className="text-[#cbd5e1] mr-4 transform -rotate-12" size={56} />
                  <h1 className="text-4xl md:text-5xl font-bold text-[#6d6875] tracking-widest">{titleText}</h1>
                </div>
              </div>

              {contentList.length === 0 && (
                <div className="border border-dashed border-[#d49a9e] bg-pink-50/50 rounded-xl p-4 flex items-center justify-center text-[#d49a9e] mb-10 shadow-sm">
                  <IconAlertCircle size={20} className="mr-2" />
                  <span className="font-medium">
                    公告：{isEnglish && semester === 1 ? '上學期' : ''}本科目目前尚未上傳，僅保留現有資源供參考
                  </span>
                </div>
              )}

              <div className="flex flex-wrap justify-center gap-6 mt-8">
                {contentList.map((item, index) => {
                  const isCompleted = !!completedTasks[item.id];
                  
                  return (
                    <button 
                      key={index}
                      onClick={() => handleTaskClick(item)}
                      className={`relative flex flex-col items-center justify-center rounded-2xl shadow-sm transition-all duration-300 border-2 overflow-hidden w-36 h-24 whitespace-pre-line text-center leading-tight px-3 font-bold text-lg cursor-pointer
                        ${isCompleted 
                          ? 'border-[#d49a9e] bg-[#d49a9e] text-white shadow-md' 
                          : 'border-gray-100 bg-white text-gray-700 hover:border-[#d49a9e] hover:text-[#d49a9e] hover:-translate-y-1'}`}
                      title="點擊前往練習並獲得積分"
                    >
                      {item.title}
                      
                      {isCompleted && (
                        <div className="absolute top-2 right-2 text-white bg-[#c28488] rounded-full p-0.5">
                          <IconCheckCircle size={16} />
                        </div>
                      )}
                    </button>
                  );
                })}
              </div>
            </div>
          </div>
        );
      };

      // --- 主渲染返回 ---
      return (
        <div className="min-h-screen flex flex-col font-sans selection:bg-pink-100 selection:text-pink-900">
          <Navbar />
          {currentPage === 'home' && <HomeView />}
          {currentPage === 'leaderboard' && <LeaderboardView />}
          {currentPage.includes('-') && <SubjectView />}
          <LoginModal />
          
          <footer className="bg-[#f2e8e9] border-t border-[#e8d5d7] pt-8 pb-6 flex flex-col justify-between px-6 items-center mt-auto">
            <div className="space-y-2 text-gray-500 text-center mb-6 max-w-2xl">
              <p className="font-bold text-sm text-gray-600">PRACTICE HUB 抽背練習統整平臺</p>
              <p className="font-medium text-xs">原版工具：米克師 ｜ 延伸開發：金魚老師</p>
              <p className="font-medium text-xs">
                原版網頁連結：<a href="https://spedmixteaching.pages.dev/" target="_blank" rel="noopener noreferrer" className="text-[#d49a9e] hover:text-[#c28488] font-bold transition-colors">https://reurl.cc/KO98Q9</a>
              </p>
              <p className="text-[10px] pt-3 text-gray-400">本作品基於原版網頁改編，採用 <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.zh_TW" target="_blank" rel="noopener noreferrer" className="hover:text-[#d49a9e] underline decoration-dotted transition-colors">CC BY-NC-SA 4.0</a> 授權。</p>
            </div>
            <p className="text-xs text-gray-400 font-medium">© 2026 PRACTICE HUB</p>
          </footer>
        </div>
      );
    }

    // 渲染應用程式
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
