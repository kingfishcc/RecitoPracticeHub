<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>練習達人</title>
    
    <!-- 載入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 載入 React 與 ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- 載入 Babel 以解析 JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- 載入 Firebase Compat (穩定版，適用於單一 HTML) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

    <style>
        /* 匯入字體並優先使用源泉圓體，若無則降級使用 Noto Sans TC */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        body {
            font-family: 'GenSenRounded TW', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: #f9f5f6;
        }
        .theme-pink-bg { background-color: #c99c9c; }
        .theme-pink-text { color: #c99c9c; }
        .sage-green-btn { background-color: #82aeb1; }
        .sage-green-btn:hover { background-color: #6c979a; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // ==========================================
        // 1. 系統設定區
        // ==========================================
        
        // Google Sheets API 網址 (您的成績資料庫)
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwrDqOlfsws0EzeTlUFkO9Z9qCQp5r0EkIee8EbMX2udC1ii04FPNy8GrVW7DXySx8f/exec";

        // Firebase 設定檔 (已清除所有隱形空白)
        const firebaseConfig = {
            apiKey: "AIzaSyAKitKzkqS5_K7lehivcAAZoGX_u4-LsQs",
            authDomain: "typeace-c8f54.firebaseapp.com",
            projectId: "typeace-c8f54",
            storageBucket: "typeace-c8f54.firebasestorage.app",
            messagingSenderId: "544799963119",
            appId: "1:544799963119:web:59f3bf9648c31dc870a81a",
            measurementId: "G-GXTJJS6Z03"
        };

        // 初始化 Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const googleProvider = new firebase.auth.GoogleAuthProvider();

        // 課程資料庫
        const GRADE_DATA = {
            7: [
                { subject: '國文', title: 'L1', url: '#' },
                { subject: '英語', title: 'Unit 1', url: '#' }
            ],
            8: [
                { subject: '國文', title: 'L1', url: '#' },
                { subject: '英語', title: 'Unit 1', url: '#' }
            ],
            9: [
                { subject: '國文', title: 'L1', url: '#' },
                { subject: '英語', title: 'Unit 1 / 課本 P.18', url: 'https://share.gemini.google/vR67MybngPM1' }
            ]
        };

        // ==========================================
        // 2. 主程式 (React Component)
        // ==========================================
        const { useState, useEffect } = React;

        function App() {
            const [user, setUser] = useState(null);
            const [displayName, setDisplayName] = useState('訪客');
            const [showLoginModal, setShowLoginModal] = useState(false);
            const [guestNameInput, setGuestNameInput] = useState('');
            const [completedTasks, setCompletedTasks] = useState(0);
            const [score, setScore] = useState(0);
            const [isSyncing, setIsSyncing] = useState(false);

            // 檢查測試模式
            const isTestMode = displayName === '154502';

            // 監聽 Firebase 登入狀態
            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged((currentUser) => {
                    if (currentUser) {
                        setUser(currentUser);
                        setDisplayName(currentUser.displayName || 'Google 帳號使用者');
                    } else {
                        setUser(null);
                        // 檢查是否有存在 localStorage 的訪客名稱
                        const savedName = localStorage.getItem('guestName');
                        if (savedName) setDisplayName(savedName);
                    }
                });
                return () => unsubscribe();
            }, []);

            // Google 登入
            const handleGoogleLogin = () => {
                auth.signInWithPopup(googleProvider)
                    .then((result) => {
                        setShowLoginModal(false);
                        alert("登入成功！");
                    })
                    .catch((error) => {
                        console.error("登入錯誤:", error);
                        alert(`登入發生錯誤: ${error.message} \n\n(若是 API Key 錯誤，請確認網頁未被翻譯引擎干擾)`);
                    });
            };

            // 訪客登入
            const handleGuestLogin = () => {
                if (guestNameInput.trim() === '') {
                    alert("請輸入您的姓名或座號喔！");
                    return;
                }
                setDisplayName(guestNameInput.trim());
                localStorage.setItem('guestName', guestNameInput.trim());
                setShowLoginModal(false);
            };

            // 登出
            const handleLogout = () => {
                auth.signOut().then(() => {
                    setDisplayName('訪客');
                    localStorage.removeItem('guestName');
                    setScore(0);
                    setCompletedTasks(0);
                });
            };

            // 模擬完成任務並上傳 Google Sheets
            const handleCompleteTask = async (taskUrl) => {
                if (displayName === '訪客') {
                    alert("請先點擊右上角「學生登入」後再開始挑戰喔！");
                    setShowLoginModal(true);
                    return;
                }

                // 更新本地分數
                const newScore = score + 100;
                const newTasksCount = completedTasks + 1;
                setScore(newScore);
                setCompletedTasks(newTasksCount);

                // 若為測試帳號，不真正上傳到試算表
                if (isTestMode) {
                    alert(`【測試模式】分數已增加，但不會上傳至排行榜。\n(前往連結: ${taskUrl})`);
                    window.open(taskUrl, '_blank');
                    return;
                }

                // 上傳至 Google Sheets
                setIsSyncing(true);
                try {
                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            name: displayName,
                            score: newScore,
                            tasksCount: newTasksCount,
                            type: user ? 'google' : 'guest'
                        })
                    });
                    console.log("成績已同步至試算表！");
                } catch (error) {
                    console.error("同步失敗:", error);
                } finally {
                    setIsSyncing(false);
                    window.open(taskUrl, '_blank');
                }
            };

            return (
                <div className="min-h-screen pb-10">
                    {/* 導覽列 */}
                    <nav className="bg-white shadow-sm p-4 flex justify-between items-center">
                        <div className="flex items-center gap-2 text-xl font-bold theme-pink-text">
                            <span>🏆</span> 練習達人
                        </div>
                        <div className="flex items-center gap-4">
                            {displayName !== '訪客' ? (
                                <div className="flex items-center gap-3">
                                    <div className="text-right">
                                        <div className={`font-bold ${isTestMode ? 'text-gray-400' : 'text-gray-700'}`}>
                                            {displayName} {isTestMode && '(測試中)'}
                                        </div>
                                        <div className="text-sm text-gray-500">
                                            積分: {score} | 完課: {completedTasks}
                                            {isSyncing && <span className="ml-2 text-xs text-blue-400">同步中...</span>}
                                        </div>
                                    </div>
                                    <button onClick={handleLogout} className="text-sm text-gray-400 hover:text-red-400 underline">登出</button>
                                </div>
                            ) : (
                                <button 
                                    onClick={() => setShowLoginModal(true)}
                                    className="sage-green-btn text-white px-5 py-2 rounded-full font-bold flex items-center gap-2 transition-colors shadow-sm"
                                >
                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 14l9-5-9-5-9 5 9 5z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 14l9-5-9-5-9 5 9 5zm0 0l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14zm-4 6v-7.5l4-2.222"></path></svg>
                                    學生登入
                                </button>
                            )}
                        </div>
                    </nav>

                    {/* 課程卡片區塊 */}
                    <div className="max-w-5xl mx-auto mt-8 px-4 grid grid-cols-1 md:grid-cols-3 gap-6">
                        {[7, 8, 9].map((grade) => (
                            <div key={grade} className="bg-white rounded-2xl shadow-sm overflow-hidden border border-gray-100">
                                <div className="theme-pink-bg text-white text-center py-4 font-bold text-lg">
                                    國 {grade === 7 ? '一' : grade === 8 ? '二' : '三'}
                                    <div className="text-xs font-normal opacity-80">Grade {grade}</div>
                                </div>
                                <div className="p-4 flex flex-col gap-3">
                                    {GRADE_DATA[grade].map((task, idx) => (
                                        <div key={idx} className="flex justify-between items-center p-3 bg-gray-50 rounded-xl hover:bg-gray-100 transition-colors">
                                            <div className="flex items-center gap-3">
                                                <div className="w-10 h-10 rounded-full bg-white shadow-sm flex items-center justify-center theme-pink-text">
                                                    {task.subject === '國文' ? '📖' : '🔤'}
                                                </div>
                                                <div>
                                                    <div className="text-sm font-bold text-gray-700">{task.subject}</div>
                                                    <div className="text-xs text-gray-500">{task.title}</div>
                                                </div>
                                            </div>
                                            <button 
                                                onClick={() => handleCompleteTask(task.url)}
                                                className="px-4 py-1 text-sm bg-white border border-gray-200 rounded-full hover:theme-pink-text hover:border-[#c99c9c] transition-colors shadow-sm"
                                            >
                                                前往挑戰
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        ))}
                    </div>

                    {/* 登入彈出視窗 */}
                    {showLoginModal && (
                        <div className="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl p-6 w-full max-w-sm shadow-xl">
                                <h2 className="text-xl font-bold text-center mb-6 theme-pink-text">歡迎來到練習達人</h2>
                                
                                {/* 方法一：Google 登入 */}
                                <button 
                                    onClick={handleGoogleLogin}
                                    className="w-full mb-4 border border-gray-300 hover:bg-gray-50 rounded-xl p-3 flex items-center justify-center gap-3 transition-colors font-bold text-gray-700 shadow-sm"
                                >
                                    <svg className="w-5 h-5" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                                    使用 Google 帳號登入
                                </button>
                                
                                <div className="flex items-center gap-3 my-4">
                                    <div className="h-px bg-gray-200 flex-1"></div>
                                    <div className="text-xs text-gray-400 font-bold">或者</div>
                                    <div className="h-px bg-gray-200 flex-1"></div>
                                </div>

                                {/* 方法二：訪客登入 */}
                                <div className="bg-gray-50 p-4 rounded-xl">
                                    <label className="block text-sm font-bold text-gray-600 mb-2">直接輸入姓名 / 座號</label>
                                    <input 
                                        type="text" 
                                        value={guestNameInput}
                                        onChange={(e) => setGuestNameInput(e.target.value)}
                                        placeholder="例如：3號王小明" 
                                        className="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:border-[#c99c9c] mb-3"
                                        onKeyDown={(e) => e.key === 'Enter' && handleGuestLogin()}
                                    />
                                    <button 
                                        onClick={handleGuestLogin}
                                        className="w-full sage-green-btn text-white py-2 rounded-lg font-bold transition-colors"
                                    >
                                        開始挑戰
                                    </button>
                                </div>

                                <button 
                                    onClick={() => setShowLoginModal(false)}
                                    className="mt-4 w-full py-2 text-sm text-gray-400 hover:text-gray-600 transition-colors"
                                >
                                    取消
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
